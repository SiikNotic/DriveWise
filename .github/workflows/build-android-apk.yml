name: Build Android APK

# Builds apps/mobile (a Capacitor app: a Vite/React web app wrapped in a
# real, committed native Android project at apps/mobile/android) into an
# installable .apk and publishes it as a GitHub Release asset, so drivers
# get "download/update from GitHub."
#
# Unlike the earlier Expo/EAS-based pipeline this replaced, the entire
# build happens directly on this runner via the Android SDK GitHub's
# ubuntu-latest images already ship with — no third-party cloud build
# service, no opaque remote logs, no EXPO_TOKEN. `./gradlew assembleDebug`
# produces a debug-signed APK using Gradle's own auto-generated debug
# keystore, which is exactly what "sideload this on a driver's phone to
# test" needs — no signing secrets to manage.

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The Capacitor CLI (`npx cap sync`) requires Node >=22 — confirmed
          # by a real CI failure ("[fatal] The Capacitor CLI requires NodeJS
          # >=22.0.0") when this was still 20, inherited from the old
          # Expo/EAS pipeline which didn't have that requirement.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify required secrets are set
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and/or VITE_SUPABASE_PUBLISHABLE_KEY repository secrets are not set — see apps/mobile/README.md's 'Getting the APK' section."
            exit 1
          fi

      - name: Build the web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: pnpm build

      - name: Sync the built web app into the native Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: apps/mobile/android
        env:
          # Always increasing across every run of this workflow — see the
          # comment on versionCode in app/build.gradle for why that matters.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage the APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk drivewise.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('mobile-run-{0}', github.run_number) }}
          name: DriveWise Android (Capacitor)
          files: apps/mobile/drivewise.apk
          body: |
            Automated build from commit ${{ github.sha }}.

            **To install or update**: download `drivewise.apk` below, open it on
            an Android device (allow "install from this source" if prompted),
            and install over the previous version.
